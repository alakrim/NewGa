<!doctype html>
<meta charset="utf-8">
<title>Sprite bake</title>
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module">
// Renders one KayKit character's animation frames (orthographic, low pitch, facing right)
// on a transparent background. Driven by tools/bake-sprites.ts through window.bake(spec).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const OPTIONAL_MESH = /^(1H_|2H_|Badge_Shield|Rectangle_Shield|Round_Shield|Spike_Shield|Barbarian_Round_Shield|Mug|Spellbook|Knife|Throwable|Knight_Helmet|Knight_Cape|Barbarian_Hat|Barbarian_Cape|Mage_Hat|Mage_Cape|Rogue_Cape)/;
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const cache = new Map();
const load = (url) => { if (!cache.has(url)) cache.set(url, loader.loadAsync(url)); return cache.get(url); };
const findBone = (root, names) => { let f = null; root.traverse((o) => { if (!f && names.includes(o.name.toLowerCase())) f = o; }); return f; };

// The KayKit atlases are an 8 x 4 grid of gradient swatches (128 x 256 px each in the 1024 px texture).
// recolor: [{ cell: "01", color: "#hex", meshes?: "regex" }] repaints swatch column 0, row 1 in that colour,
// keeping its gradient, on every mesh or only on meshes whose name matches `meshes` (swatches are shared:
// the shield face swatch is also the blade of every sword).
function recolorAtlas(root, all) {
  const done = new Map();
  root.traverse((o) => {
    if (!o.isMesh || !o.material.map) return;
    const recolor = all.filter((r) => !r.meshes || new RegExp(r.meshes).test(o.name));
    if (!recolor.length) return;
    const src = o.material.map;
    const key = src.uuid + JSON.stringify(recolor);
    if (!done.has(key)) {
      const img = src.image;
      const cv = document.createElement('canvas');
      cv.width = img.width; cv.height = img.height;
      const g = cv.getContext('2d');
      g.drawImage(img, 0, 0);
      const cw = img.width / 8, ch = img.height / 4;
      for (const { cell, color } of recolor) {
        const x0 = Number(cell[0]) * cw, y0 = Number(cell[1]) * ch;
        const d = g.getImageData(x0, y0, cw, ch);
        const t = new THREE.Color(color);
        const target = { h: 0, s: 0, l: 0 };
        t.getHSL(target);
        let mean = 0;
        for (let i = 0; i < d.data.length; i += 4) mean += Math.max(d.data[i], d.data[i + 1], d.data[i + 2]);
        mean /= d.data.length / 4;
        const c = new THREE.Color();
        for (let i = 0; i < d.data.length; i += 4) {
          // keep the swatch's light-to-dark gradient, centred on the target colour's lightness
          const v = Math.max(d.data[i], d.data[i + 1], d.data[i + 2]) / Math.max(1, mean);
          c.setHSL(target.h, target.s, Math.min(1, target.l * v));
          d.data[i] = c.r * 255; d.data[i + 1] = c.g * 255; d.data[i + 2] = c.b * 255;
        }
        g.putImageData(d, x0, y0);
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.flipY = src.flipY; tex.colorSpace = src.colorSpace; tex.magFilter = src.magFilter; tex.minFilter = src.minFilter;
      tex.wrapS = src.wrapS; tex.wrapT = src.wrapT;
      done.set(key, tex);
    }
    o.material = o.material.clone();
    o.material.map = done.get(key);
  });
}

async function build(spec) {
  const { model, weapons, recolor } = spec;
  const gltf = await load(`/public/assets/characters/${model}.glb`);
  const root = SkeletonUtils.clone(gltf.scene);
  const show = new Set(weapons);
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    if (OPTIONAL_MESH.test(o.name) && !show.has(o.name)) o.visible = false;
    if (spec.hide?.includes(o.name)) o.visible = false;
  });
  if (recolor?.length) recolorAtlas(root, recolor);
  const hands = { r: findBone(root, ['handslotr', 'handslot.r', 'handslot_r']), l: findBone(root, ['handslotl', 'handslot.l', 'handslot_l']) };
  for (const w of weapons) {
    if (!w.startsWith('Skeleton_')) continue;
    const src = (await load(`/public/assets/skeleton-weapons/${w}.gltf`)).scene;
    const bone = /Shield/.test(w) ? hands.l : hands.r;
    if (bone) bone.add(src.clone(true));
  }
  root.rotation.y = Math.PI / 2 - spec.yaw; // KayKit faces +z; sprites face right (+x), turned `yaw` toward the viewer
  if (spec.extraScale) root.scale.setScalar(spec.extraScale);
  return { root, gltf };
}

function stage(spec, root) {
  const { cell, cellW, worldHeight, pitch, lift } = spec;
  const scene = new THREE.Scene();
  scene.add(root);
  scene.add(new THREE.HemisphereLight('#ffffff', '#5a4a60', 1.6));
  const key = new THREE.DirectionalLight('#ffe6c0', 2.8); // warm golden-hour key from the upper left, like the HD-2D sun
  key.position.set(-4, 6, 5);
  const rim = new THREE.DirectionalLight('#bcd4ff', 1.2);
  rim.position.set(3, 2, -4);
  scene.add(key, rim);

  const scale = 2; // render at 2x; the post step downsamples to `cell`
  const w = cellW * scale, h = cell * scale;
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(w, h, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; // same as the web client's hero portraits
  renderer.toneMappingExposure = 1.15;
  const half = worldHeight / 2;
  const halfW = half * cellW / cell;
  const cam = new THREE.OrthographicCamera(-halfW, halfW, half, -half, 0.1, 100);
  const r = THREE.MathUtils.degToRad(pitch);
  const target = new THREE.Vector3(0, lift, 0);
  cam.position.copy(target).add(new THREE.Vector3(0, Math.sin(r), Math.cos(r)).multiplyScalar(20));
  cam.lookAt(target);
  return { scene, renderer, cam };
}

window.bake = async (spec) => {
  const { root, gltf } = await build(spec);
  const { scene, renderer, cam } = stage(spec, root);
  const { clips } = spec;
  const mixer = new THREE.AnimationMixer(root);
  const out = {};
  for (const c of clips) {
    const clip = gltf.animations.find((a) => a.name === c.clip);
    if (!clip) { out[c.name] = { error: `no clip ${c.clip}` }; continue; }
    mixer.stopAllAction();
    const action = mixer.clipAction(clip);
    action.reset().play();
    if (c.once) { action.setLoop(THREE.LoopOnce, 1); action.clampWhenFinished = true; }
    const frames = [];
    for (let i = 0; i < c.frames; i++) {
      // loops sample [0, d) so the last frame flows into the first; one-shots end on the final pose
      const t = c.once ? (clip.duration * i) / (c.frames - 1) : (clip.duration * i) / c.frames;
      action.time = Math.min(t, clip.duration - 1e-4);
      mixer.update(0);
      renderer.render(scene, cam);
      frames.push(renderer.domElement.toDataURL('image/png'));
    }
    out[c.name] = { frames, duration: clip.duration };
  }
  renderer.dispose();
  return out;
};
// For each atlas swatch: how many pixels of an idle render change when that swatch turns magenta.
window.cellUsage = async (spec) => {
  const shot = async (recolor) => {
    const { root, gltf } = await build({ ...spec, recolor });
    const { scene, renderer, cam } = stage(spec, root);
    const mixer = new THREE.AnimationMixer(root);
    const idle = gltf.animations.find((a) => a.name === 'Idle');
    if (idle) { mixer.clipAction(idle).play(); mixer.update(0.3); }
    renderer.render(scene, cam);
    const gl = renderer.getContext();
    const px = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
    gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, px);
    renderer.dispose();
    return px;
  };
  const base = await shot([]);
  const out = {};
  for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) {
    const px = await shot([{ cell: `${c}${r}`, color: '#ff00ff' }]);
    let n = 0;
    for (let i = 0; i < px.length; i += 4) if (Math.abs(px[i] - base[i]) + Math.abs(px[i + 1] - base[i + 1]) + Math.abs(px[i + 2] - base[i + 2]) > 60) n++;
    if (n) out[`${c}${r}`] = n;
  }
  return out;
};
// A static model (a building) in one frame: same light and camera angles as the characters, but the frustum is
// fitted to the model's bounding box so any building fills the frame. spec: { url, cell, cellW, pitch, yaw }
window.bakeStatic = async (spec) => {
  const gltf = await load(spec.url);
  const root = SkeletonUtils.clone(gltf.scene);
  root.rotation.y = -spec.yaw;
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  const { renderer, scene, cam } = stage({ ...spec, worldHeight: 3.2, lift: c.y }, root);
  cam.position.set(c.x, c.y, c.z).add(new THREE.Vector3(0, Math.sin(THREE.MathUtils.degToRad(spec.pitch)), Math.cos(THREE.MathUtils.degToRad(spec.pitch))).multiplyScalar(40));
  cam.lookAt(c);
  cam.updateMatrixWorld(true);
  const inv = cam.matrixWorldInverse;
  const lo = new THREE.Vector3(1e9, 1e9, 0), hi = new THREE.Vector3(-1e9, -1e9, 0);
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const v = new THREE.Vector3(x, y, z).applyMatrix4(inv);
    lo.min(v); hi.max(v);
  }
  const aspect = spec.cellW / spec.cell, pad = 1.06;
  const halfH = Math.max((hi.y - lo.y) / 2, (hi.x - lo.x) / 2 / aspect) * pad;
  const mx = (hi.x + lo.x) / 2, my = (hi.y + lo.y) / 2;
  cam.left = mx - halfH * aspect; cam.right = mx + halfH * aspect; cam.top = my + halfH; cam.bottom = my - halfH;
  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  renderer.dispose();
  return url;
};
window.ready = true;
</script>
